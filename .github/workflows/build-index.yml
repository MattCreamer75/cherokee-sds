name: Rebuild SDS index

# Runs automatically whenever PDFs are added/removed/changed under /sds,
# and can also be run manually from the Actions tab.
on:
  push:
    paths:
      - "sds/**"
      - "tools/build_index.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF reader
        run: pip install pdfplumber

      - name: Rebuild sds-index.json
        run: python tools/build_index.py

      - name: Commit updated index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet sds-index.json; then
            git add sds-index.json
            git commit -m "Auto-rebuild SDS index"
            git push
          else
            echo "Index already up to date."
          fi
