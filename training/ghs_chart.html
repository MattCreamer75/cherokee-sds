<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;font-family:'Segoe UI',Arial,Helvetica,sans-serif}
  body{background:linear-gradient(#e9ebf0 0%,#ffffff 26%);color:#1a1a1a}
  .hdr{padding:46px 64px 0 64px}
  .row1{display:flex;align-items:center;gap:20px}
  .tag{background:#D9531E;color:#fff;font-weight:800;font-size:44px;letter-spacing:.5px;padding:8px 18px;border-radius:10px}
  .title{font-weight:800;font-size:40px;color:#1a1a1a}
  .sub{margin-top:14px;font-size:24px;color:#6e6e6e}
  .grid{padding:30px 60px 0}
  .r{display:flex;justify-content:center;gap:48px}
  .r.two{margin-top:18px}
  .cell{width:330px;display:flex;flex-direction:column;align-items:center}
  .cell img{width:232px;height:232px;object-fit:contain}
  .name{margin-top:10px;font-weight:800;font-size:36px;text-align:center;line-height:1.05}
  .code{margin-top:4px;font-size:22px;color:#8c8c8c}
</style></head><body>
  <div class="hdr">
    <div class="row1"><span class="tag">GHS PICTOGRAMS</span><span class="title">A Guide for Hazard Communication</span></div>
    <div class="sub">Cherokee Industrial Fabricators &nbsp;&bull;&nbsp; Lufkin, TX &nbsp;&bull;&nbsp; OSHA 29 CFR 1910.1200</div>
  </div>
  <div class="grid">
    <div class="r">
      <div class="cell"><img src="https://www.osha.gov/sites/default/files/inline-images/image3.png"><div class="name">Explosive</div><div class="code">GHS01</div></div>
      <div class="cell"><img src="https://www.osha.gov/sites/default/files/inline-images/image2.png"><div class="name">Flammable</div><div class="code">GHS02</div></div>
      <div class="cell"><img src="https://www.osha.gov/sites/default/files/inline-images/image1.png"><div class="name">Oxidizing</div><div class="code">GHS03</div></div>
      <div class="cell"><img src="https://www.osha.gov/sites/default/files/inline-images/image6.png"><div class="name">Compressed gas</div><div class="code">GHS04</div></div>
      <div class="cell"><img src="https://www.osha.gov/sites/default/files/inline-images/image5.png"><div class="name">Corrosive</div><div class="code">GHS05</div></div>
    </div>
    <div class="r two">
      <div class="cell"><img src="https://www.osha.gov/sites/default/files/inline-images/image4.png"><div class="name">Toxic</div><div class="code">GHS06</div></div>
      <div class="cell"><img src="https://www.osha.gov/sites/default/files/inline-images/image9.png"><div class="name">Harmful</div><div class="code">GHS07</div></div>
      <div class="cell"><img src="https://www.osha.gov/sites/default/files/inline-images/image7.png"><div class="name">Health hazard</div><div class="code">GHS08</div></div>
      <div class="cell"><img src="https://www.osha.gov/sites/default/files/inline-images/image8.png"><div class="name">Environmental hazard</div><div class="code">GHS09</div></div>
    </div>
  </div>
</body></html>
